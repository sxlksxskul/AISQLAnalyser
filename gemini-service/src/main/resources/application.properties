# Spring Boot Configuration
spring.application.name=sql-query-analyser-gemini
server.port=9090

# Logging Configuration
logging.level.com.sqlanalyzer=DEBUG
logging.level.dev.langchain4j=DEBUG

# Gemini Configuration
gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.model-name=gemini-2.5-flash
gemini.timeout=60
gemini.temperature=0.1

# CORS Configuration
management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
